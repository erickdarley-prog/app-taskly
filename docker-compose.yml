# Opcional: levanta solo MongoDB, por si prefieres usar Docker en lugar de instalar MongoDB.
# Uso: docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: taskly-mongo
    ports:
      - "27017:27017"
    volumes:
      - taskly-datos:/data/db
    restart: unless-stopped

volumes:
  taskly-datos:
